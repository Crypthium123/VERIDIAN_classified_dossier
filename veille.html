  document.getElementById("b").onclick=async()=>{const m=document.getElementById("m");let bytes;try{bytes=Uint8Array.from(atob(await dec(M,document.getElementById("k").value.trim().toLowerCase())),c=>c.charCodeAt(0))}catch(e){m.textContent="Flux chiffré.";return}m.textContent="Flux ouvert.";const W=240,H=80,mk=(x,y)=>{x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return 0;const i=y*W+x;return bytes[i>>3]>>(7-(i&7))&1},cv=document.getElementById("c"),g=cv.getContext("2d"),N=2600,d=[];for(let i=0;i<N;i++)d.push({x:Math.random()*W,y:Math.random()*H,l:Math.random()*30|0});setInterval(()=>{g.fillStyle="#0d0f0e";g.fillRect(0,0,480,160);g.fillStyle="#7fd39a";for(const p of d){if(mk(p.x,p.y)){p.x+=1.4}else{const a=Math.random()*6.283;p.x+=Math.cos(a)*1.4;p.y+=Math.sin(a)*1.4}if(++p.l>30||p.x<0||p.x>=W||p.y<0||p.y>=H){p.x=Math.random()*W;p.y=Math.random()*H;p.l=0}g.fillRect(p.x*2,p.y*2,2,2)}},60)};</script></body></html>
